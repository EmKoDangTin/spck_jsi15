<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Blue</title>

    <!-- Firebase SDK (Đã thêm đủ 4 thư viện để tránh lỗi firebase.storage) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"></script>

    <!-- Firebase Config -->
    <script src="./script/firebase-config.js"></script>

    <!-- Bootstrap 5 CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>
    <!--Css-->
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-secondary pe-5 ps-5">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="#">BookBlue</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="#">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <input class="form-control me-2" type="search" placeholder="Search..." />
                    <button class="btn btn-outline-dark bg-white me-3" type="submit">Search</button>

                    <!-- User Dropdown -->
                    <div id="user-dropdown" class="nav-item dropdown d-none">
                        <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fa-regular fa-user"></i> <span id="user-email">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item text-danger" href="#" id="btn-logout">
                                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Nội dung chính -->
    <section class="container mt-5">
        <h1 class="mb-4">Available Books</h1>
        <!-- Container đổ danh sách sách từ JS -->
        <div id="products-container"></div>
    </section>

    <!-- Nhúng file JS chính -->
    <script src="./script/index.js"></script>
</body>

</html>

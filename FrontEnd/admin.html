<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management</title>
    
    <!-- Firebase Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js" crossorigin="anonymous"></script>
    
    <!-- Firebase Configuration -->
    <script src="./script/firebase-config.js"></script>

    <!-- Bootstrap 5 CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>
    <!-- Css -->
     <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-secondary pe-5 ps-5">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="#">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" />
                    <button class="btn btn-outline-dark bg-white" type="submit">Search</button>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-3">Books</h1>
            <!-- Nút Add Book (Đã xóa data-bs-toggle để JS xử lý mở Modal) -->
            <button class="btn btn-primary mb-3" id="btn-add-product">
                <i class="fa-solid fa-plus"></i> Add Book
            </button>
        </div>
        
        <!-- Danh sách sách sẽ render vào đây -->
        <div id="products-container"></div>
    </section>

    <!-- Modal Dùng Chung Cho Cả Add Và Edit -->
    <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="product-name" class="form-label">Book Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-name" placeholder="Enter book name">
                    </div>
                    <div class="mb-3">
                        <label for="product-author" class="form-label">Author <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-author" placeholder="Enter author">
                    </div>
                    <div class="mb-3">
                        <label for="product-category" class="form-label">Category <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-category" placeholder="Enter category">
                    </div>
                    <div class="mb-3">
                        <label for="product-description" class="form-label">Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="product-description" rows="3" placeholder="Enter description"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="product-date" class="form-label">Publish Date <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-date" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="mb-3">
                        <label for="product-image" class="form-label">Image URL <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-image" placeholder="Paste image link here">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="btn-save">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./script/admin.js"></script>
</body>
</html>

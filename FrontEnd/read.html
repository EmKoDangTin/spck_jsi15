<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc sách</title>

    <!-- Firebase Libraries (giống các trang khác vì firebase-config.js dùng cả auth/storage) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js" crossorigin="anonymous"></script>

    <!-- Firebase Configuration -->
    <script src="./script/firebase-config.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>

    <!-- PDF.js (bản 3.x dạng script thường, không cần bundler) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>

    <style>
        body { background: #3b3f45; }
        #reader { min-height: calc(100vh - 56px); }
        #pdf-canvas { max-width: none; background: #fff; }
        #page-input { width: 64px; }
    </style>
</head>

<body>
    <header class="navbar bg-secondary sticky-top px-3 gap-2 flex-nowrap">
        <a href="./index.html" class="btn btn-outline-light btn-sm" id="btn-back" title="Quay lại">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <span id="book-title" class="text-white fw-semibold text-truncate flex-grow-1">Đang tải...</span>

        <div class="d-flex align-items-center gap-1 text-white">
            <button class="btn btn-light btn-sm" id="btn-prev" title="Trang trước (←)" disabled>
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <input type="number" min="1" class="form-control form-control-sm text-center" id="page-input" disabled>
            <span class="small">/ <span id="page-total">–</span></span>
            <button class="btn btn-light btn-sm" id="btn-next" title="Trang sau (→)" disabled>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="d-none d-md-flex align-items-center gap-1 text-white">
            <button class="btn btn-light btn-sm" id="btn-zoom-out" title="Thu nhỏ" disabled>
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <span class="small text-center" id="zoom-label" style="width: 44px;">100%</span>
            <button class="btn btn-light btn-sm" id="btn-zoom-in" title="Phóng to" disabled>
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
        </div>
    </header>

    <main id="reader" class="py-3 px-2 text-center overflow-auto">
        <div id="status" class="text-white mt-5">
            <div class="spinner-border text-light" role="status"></div>
            <p class="mt-3 mb-0">Đang tải sách...</p>
        </div>
        <canvas id="pdf-canvas" class="shadow d-none"></canvas>
    </main>

    <script src="./script/read.js"></script>
</body>

</html>

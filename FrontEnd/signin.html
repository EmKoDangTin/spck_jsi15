<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBlue - Đăng nhập</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>

    <!-- Firebase configuration -->
    <script src="./script/firebase-config.js"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>

    <!-- Bootstrap 5 CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    <!-- CSS Custom -->
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/alert.css">
</head>

<body>
    <div class="min-vh-100 d-flex justify-content-center align-items-center p-3">
        <div class="card auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-book-open fs-1 text-info mb-2"></i>
                <h2 class="auth-title">Chào mừng trở lại</h2>
                <p class="text-muted small">Đăng nhập để tiếp tục vào BookBlue</p>
            </div>

            <div class="mb-3">
                <label for="txt-email" class="form-label">Địa chỉ Email</label>
                <input id="txt-email" class="form-control" type="email" placeholder="name@example.com">
            </div>

            <div class="mb-3">
                <label for="txt-password" class="form-label">Mật khẩu</label>
                <input id="txt-password" class="form-control" type="password" placeholder="••••••••">
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    Ghi nhớ đăng nhập
                </label>
            </div>

            <button id="btn-login" class="btn btn-auth w-100 mb-3">Đăng nhập</button>

            <div class="text-center">
                <span class="text-muted small">Chưa có tài khoản? </span>
                <a class="auth-link" href="./signup.html">Tạo tài khoản mới</a>
            </div>
        </div>
    </div>

    <!-- Thông báo Alert -->
    <div id="notification" class="notification">
        <div class="notification-icon" id="notification-icon">!</div>
        <div class="notification-content">
            <h5 id="notification-title">Lỗi</h5>
            <p id="notification-message">Có lỗi xảy ra.</p>
        </div>
        <button id="notification-close">&times;</button>
    </div>

    <script src="./script/signin.js"></script>
</body>

</html>
